<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS OS</title>
    <style>
        body {
            background-color: #000;
            color: #00e5ff;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .hud-container {
            border: 2px solid #00e5ff;
            border-radius: 15px;
            padding: 20px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
            background: rgba(0, 20, 30, 0.6);
        }
        h1 {
            text-align: center;
            font-size: 24px;
            letter-spacing: 3px;
            margin-top: 0;
            text-shadow: 0 0 10px #00e5ff;
        }
        .status-box {
            border: 1px dashed #00e5ff;
            padding: 10px;
            margin-bottom: 20px;
            font-size: 13px;
            background: rgba(0, 0, 0, 0.4);
        }
        .chat-box {
            height: 200px;
            border: 1px solid #00e5ff;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            background: #000;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            background: #000;
            border: 1px solid #00e5ff;
            color: #00e5ff;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
        }
        button {
            background: #00e5ff;
            color: #000;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
        button:active {
            background: #00b2cc;
        }
        .system-log {
            color: #888;
            font-size: 11px;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="hud-container">
        <h1>J.A.R.V.I.S.</h1>
        
        <div class="status-box">
            <div>SYSTEM STATUS: <span style="color: lime; font-weight: bold;">ONLINE</span></div>
            <div>SECURE LINK: <span style="color: lime;">ACTIVE</span></div>
            <div id="battery-status">DEVICE BATTERY: LOADING...</div>
        </div>

        <div class="chat-box" id="chatBox">
            <div style="color: #888;">[System initialized. JARVIS is at your service.]</div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Send command or message..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">SEND</button>
        </div>

        <div class="system-log">
            MARK INTERFACE V4.0 // SECURE USER NODE
        </div>
    </div>

    <script>
        // Automatically fetch battery status if available on Android browser
        if (navigator.getBattery) {
            navigator.getBattery().then(function(battery) {
                function updateBattery() {
                    document.getElementById('battery-status').innerText = "DEVICE BATTERY: " + Math.round(battery.level * 100) + "%";
                }
                updateBattery();
                battery.addEventListener('levelchange', updateBattery);
            });
        } else {
            document.getElementById('battery-status').innerText = "DEVICE BATTERY: ACCESS GRANTED";
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const message = input.value.trim();

            if (message === '') return;

            // User message
            chatBox.innerHTML += `<div><span style="color: #ff00ea;">YOU:</span> ${message}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Simulated JARVIS responses
            setTimeout(() => {
                let response = "I am processing your command, sir. However, external mainframe connection is not yet configured.";
                
                const lowerMsg = message.toLowerCase();
                if (lowerMsg.includes('hello') || lowerMsg.includes('hi')) {
                    response = "Hello, sir. Welcome back. Systems are operating within normal parameters.";
                } else if (lowerMsg.includes('status')) {
                    response = "All micro-protocols are running efficiently. Security grid is active.";
                } else if (lowerMsg.includes('clear')) {
                    chatBox.innerHTML = '<div style="color: #888;">[Console cleared]</div>';
                    return;
                }

                chatBox.innerHTML += `<div><span style="color: #00e5ff; font-weight: bold;">JARVIS:</span> ${response}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 800);
        }
    </script>

</body>
</html>
